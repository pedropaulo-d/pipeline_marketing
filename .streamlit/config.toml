# Tema dark fixo do painel analitico.
#
# Os controles do Streamlit sao componentes React e derivam suas cores do tema,
# nao apenas do CSS da pagina. Declarar `base = "dark"` aqui faz selects,
# multiselects, date picker, popovers e tabelas abrirem com a mesma identidade
# independentemente do tema do navegador ou do sistema operacional.
#
# Este arquivo e lido do diretorio de trabalho. Localmente, isso e a raiz do
# repositorio (`streamlit run dashboard/app.py`); no container, o Dockerfile o
# copia para `/app/.streamlit/config.toml`, que e o WORKDIR.

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#080B10"
secondaryBackgroundColor = "#11161E"
textColor = "#F1F5F9"
borderColor = "#27303D"
linkColor = "#A78BFA"
baseRadius = "medium"
showSidebarBorder = false
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161D27"
textColor = "#F1F5F9"
primaryColor = "#8B5CF6"
borderColor = "#27303D"
linkColor = "#A78BFA"
showWidgetBorder = true
baseRadius = "medium"
