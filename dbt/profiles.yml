# Conexao do dbt com o Data Warehouse.
# Os defaults apontam para o servico `db` do docker-compose; as variaveis de
# ambiente permitem apontar para outro Postgres (ex: Supabase) sem editar
# este arquivo.
tcc_marketing:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'db') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'etl') }}"
      password: "{{ env_var('DBT_PASSWORD', 'etl') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'marketing_dw') }}"
      # Schema de fallback, exigido pelo adapter mas nunca usado: todo modelo
      # declara `+schema` (silver/gold) no dbt_project.yml e o override de
      # `generate_schema_name` devolve esse nome exato. O valor era `public`,
      # sobra do ETL legado; se um modelo esquecer o `+schema`, cair em
      # `public` seria silencioso — o schema existe e ainda guarda a tabela do
      # benchmark. Com este nome, o objeto orfao aparece no lugar errado de
      # forma obvia, em vez de se misturar com dado real.
      schema: sem_schema_customizado
      threads: 4
