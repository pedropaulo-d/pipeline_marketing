        - {anuncio_external_id: A, result_type: null, resultado_valido: false}

  - name: resultado_google_permanece_sem_suporte
    description: Conversoes e CPA Google nao sao reinterpretados como Resultado Meta.
    model: stg_google_ads
    given:
      - input: source('bronze', 'raw_ads')
        format: sql
