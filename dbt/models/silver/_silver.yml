    model: stg_meta_ads
    given:
      - input: source('bronze', 'raw_ads')
        format: sql
        rows: |
          select 'meta_ads'::text as source, date '2026-08-01' as reference_date,
                 timestamptz '2026-08-02 10:00:00+00' as extracted_at,
                 '{"account_id":"C1","campaign_id":"CP1","adset_id":"S1","ad_id":"A"}'::jsonb as payload
    expect:
      rows:
        - {anuncio_external_id: A, result_type: null, result_count: null,
           result_attribution_window: null, cost_per_result: null,
           resultado_valido: true}

  - name: resultado_meta_item_sem_values_falha_fechado
    description: Item estruturalmente presente nao e confundido com array vazio.
    model: stg_meta_ads
    given:
      - input: source('bronze', 'raw_ads')
        format: sql
        rows: |
          select 'meta_ads'::text as source, date '2026-08-01' as reference_date,
