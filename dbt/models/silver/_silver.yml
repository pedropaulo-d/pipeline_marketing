                     {"indicator":"lead","values":[{"attribution_windows":["default"],"value":"9"}]},
                     {"indicator":"video_thruplay_watched_actions","values":[{"attribution_windows":["default"],"value":"81"}]}],
                   "cost_per_result":[
                     {"indicator":"video_thruplay_watched_actions","values":[{"attribution_windows":["default"],"value":"0.42"}]},
                     {"indicator":"lead","values":[{"attribution_windows":["default"],"value":"15.35"}]}]}'::jsonb as payload
    expect:
      rows:
        - {anuncio_external_id: A, result_type: null, resultado_valido: false}

  - name: resultado_meta_multiplas_janelas_falha_fechado
