                 '{"account_id":"C1","campaign_id":"CP1","adset_id":"S1","ad_id":"A",
                   "results":[{"indicator":"lead","values":[{"attribution_windows":["default"],"value":"9"}]}]}'::jsonb as payload
    expect:
      rows:
        - {anuncio_external_id: A, result_type: null, resultado_valido: false}

  - name: resultado_meta_sem_result_falha_fechado
    description: Cost sem result correspondente e marcado como invalido.
    model: stg_meta_ads
    given:
      - input: source('bronze', 'raw_ads')
        format: sql
        rows: |
          select 'meta_ads'::text as source, date '2026-08-01' as reference_date,
                 timestamptz '2026-08-02 10:00:00+00' as extracted_at,
                 '{"account_id":"C1","campaign_id":"CP1","adset_id":"S1","ad_id":"A",
                   "cost_per_result":[{"indicator":"lead","values":[{"attribution_windows":["default"],"value":"15.35"}]}]}'::jsonb as payload
    expect:
      rows:
        - {anuncio_external_id: A, result_type: null, resultado_valido: false}

  - name: resultado_meta_multiplos_indicators_falha_fechado
    description: Dois tipos oficiais nao sao somados nem priorizados.
    model: stg_meta_ads
    given:
      - input: source('bronze', 'raw_ads')
        format: sql
        rows: |
          select 'meta_ads'::text as source, date '2026-08-01' as reference_date,
                 timestamptz '2026-08-02 10:00:00+00' as extracted_at,
