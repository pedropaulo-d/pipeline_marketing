name: 'tcc_marketing'
version: '1.0.0'
config-version: 2

profile: 'tcc_marketing'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Dimensoes com versionamento SCD Tipo 2, no formato [modelo, chave natural].
# Fonte unica da lista: era repetida nos dois testes de consistencia SCD2, que
# precisavam ser editados juntos a cada dimensao nova.
vars:
  # Fontes da bronze e o modelo de staging que consome cada uma. Espelha o
  # registro de plataformas (plataformas.py) — o dbt nao consegue ler o Python,
  # entao plataforma nova entra tambem aqui.
  #
  # `ignoradas`: chaves que o payload traz e que o staging NAO le de proposito.
  # Sao os campos de data, consumidos pelo bronze_loader como `reference_date`
  # antes do payload chegar na silver. Sem esta lista o teste
  # assert_campos_extraidos_sao_consumidos acusaria falso positivo nelas.
  fontes_staging:
    - fonte: meta_ads
      modelo: stg_meta_ads
      ignoradas: ["date_start", "date_stop"]
    - fonte: google_ads
      modelo: stg_google_ads
      ignoradas: ["date"]

  dimensoes_scd2:
    - ["dim_conta", "conta_nk"]
    - ["dim_campanha", "campanha_nk"]
    - ["dim_adset", "adset_nk"]
    - ["dim_anuncio", "anuncio_nk"]

models:
  tcc_marketing:
    # Silver: limpeza e tipagem, 1:1 com a fonte. Views — o custo de
    # recomputar e irrelevante neste volume e o dado fica sempre fresco.
    silver:
      +materialized: view
      +schema: silver
    # Gold: modelo dimensional consumido pelo BI. Tabelas materializadas.
    gold:
      +materialized: table
      +schema: gold
